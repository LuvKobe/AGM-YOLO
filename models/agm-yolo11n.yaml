# AGM-YOLO (YOLO11n scale), compatible with ultralytics==8.3.138
# AIC on backbone C3k2 stages; GCE after C2PSA; MSA in the three-scale Detect head.
nc: 6
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25, 1, True, True, 16]]       # 2 C3k2-AIC
  - [-1, 1, Conv, [256, 3, 2]]                                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25, 1, True, True, 16]]       # 4 C3k2-AIC
  - [-1, 1, Conv, [512, 3, 2]]                                 # 5-P4/16
  - [-1, 2, C3k2, [512, True, 0.50, 1, True, True, 16]]        # 6 C3k2-AIC
  - [-1, 1, Conv, [1024, 3, 2]]                                # 7-P5/32
  - [-1, 2, C3k2, [1024, True, 0.50, 1, True, True, 16]]       # 8 C3k2-AIC
  - [-1, 1, SPPF, [1024, 5]]                                  # 9
  - [-1, 2, C2PSA, [1024, 0.50, True, 16]]                    # 10 C2PSA -> GCE

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                # 11
  - [[-1, 6], 1, Concat, [1]]                                 # 12
  - [-1, 2, C3k2, [512, False]]                               # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                # 14
  - [[-1, 4], 1, Concat, [1]]                                 # 15
  - [-1, 2, C3k2, [256, False]]                               # 16 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                                # 17
  - [[-1, 13], 1, Concat, [1]]                                # 18
  - [-1, 2, C3k2, [512, False]]                               # 19 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                                # 20
  - [[-1, 10], 1, Concat, [1]]                                # 21
  - [-1, 2, C3k2, [1024, True]]                               # 22 P5/32
  - [[16, 19, 22], 1, Detect, [nc, True]]                     # 23 MSA(P3/P4/P5) -> Detect
